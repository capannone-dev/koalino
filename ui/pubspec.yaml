# Defines the Flutter package used by the Note Taker mobile and desktop client.
name: note_taker_ui
description: Offline-first meeting note client with a Rust FFI boundary.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  audioplayers: ^6.1.0
  clock: ^1.1.1
  ffi: ^2.1.4
  file_picker: ^8.1.7
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  fl_chart: ^0.69.2
  path_provider: ^2.1.5

dev_dependencies:
  fake_async: ^1.3.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
