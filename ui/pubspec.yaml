# Defines the Flutter package used by the Note Taker mobile and desktop client.
name: note_taker_ui
description: Offline-first meeting note client with a Rust FFI boundary.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  audioplayers: ^6.1.0
  # In-app camera for meeting photos (Issue #54); Windows needs its unendorsed implementation.
  camera: ^0.12.2
  camera_windows: ^0.3.0+1
  clock: ^1.1.1
  ffi: ^2.1.4
  file_picker: ^8.1.7
  flutter:
    sdk: flutter
  # Translations of the app's text and the Material widgets' own (Issue #124).
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  # Shows Markdown project resources inside the app (Issue #85; pure Dart, approved by the owner).
  markdown: ^7.3.1
  fl_chart: ^0.69.2
  # Formats the translated messages (Issue #124); the version flutter_localizations pins.
  intl: any
  path_provider: ^2.1.5
  # Shows PDF project resources inside the app with PDFium (Issue #85; approved by the owner).
  pdfrx: ^2.11.0
  # Draws pairing invites as QR codes (Issue #65; pure Dart, approved by the owner, 2026-10-30).
  qr_flutter: ^4.1.0

dev_dependencies:
  fake_async: ^1.3.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # Generates AppLocalizations from lib/l10n/*.arb (l10n.yaml, Issue #124).
  generate: true
