# Defines the dependency-light Rust core scaffold; AI engines remain ports only.
[package]
name = "note-taker-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Offline-first meeting note-taking core"

[lib]
path = "core/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "cli"
path = "core/bin/cli.rs"

[[bin]]
name = "daemon"
path = "core/bin/daemon.rs"

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
automerge = "0.6.1"
futures = "0.3.31"
libp2p = { version = "0.56.0", features = ["macros", "mdns", "noise", "request-response", "tcp", "tokio", "yamux"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
thiserror = "2.0.17"
tracing = "0.1.41"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.18.1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.48.0", features = ["macros", "rt", "time"] }
