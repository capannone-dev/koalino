# Defines the dependency-light Rust core scaffold; AI engines remain ports only.
[package]
name = "note-taker-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
description = "Offline-first meeting note-taking core"

[lib]
path = "core/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
# Keeps the default core build free of native model dependencies and model initialization.
default = []
# Enables the adapter-local whisper.cpp binding for explicitly opted-in local inference.
local-ai = ["dep:whisper-rs", "dep:whisper-rs-sys"]
# Adds the phone GPU backend: the vendored whisper.cpp with OpenCL, opened at run time (#75).
mobile-gpu = ["local-ai", "whisper-rs-sys/opencl"]
vad = ["dep:webrtc-vad"]
# Captures the default microphone with cpal (ALSA on Linux, WASAPI on Windows, AAudio on Android;
# Issue #45). Linux builds need the ALSA development package (`libasound2-dev`).
microphone = ["dep:cpal"]
# Also records what the computer plays (#108): WASAPI loopback on Windows, the default sink's monitor
# through cpal's PulseAudio host on Linux (pure Rust, no system library).
computer-sound = ["microphone", "cpal/pulseaudio"]
# Runs local speaker diarization with ONNX Runtime (Issue #44). ONNX Runtime's prebuilt library is
# downloaded at build time (approved by the owner, 2026-10-30); the models are exported with
# `tools/diarization/export_models.py` and their paths come from configuration.
diarization = ["dep:ort"]
# Runs Whisper on a Qualcomm NPU through ONNX Runtime's QNN provider (#75; ONNX Runtime approved by
# the owner, 2026-11-13). The QNN libraries and the model are downloaded on request, never built in.
npu-whisper = ["dep:ort", "ort/qnn", "local-ai"]

[[bin]]
name = "cli"
path = "core/bin/cli.rs"

[[bin]]
name = "browser-host"
path = "core/bin/browser_host.rs"

[[bin]]
name = "daemon"
path = "core/bin/daemon.rs"

[[bin]]
name = "note_taker_mcp"
path = "core/bin/mcp.rs"

[dependencies]
# AES-256-GCM for voice embeddings at rest; `zeroize` wipes key schedules on drop (Issue #31).
aes-gcm = { version = "0.10.3", features = ["zeroize"] }
anyhow = "1.0.100"
# Argon2id passphrase key derivation; only the raw `hash_password_into` API is needed.
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "zeroize"] }
async-trait = "0.1.89"
# Decodes the browser extension's audio and slides, which native messaging carries as base64 JSON
# strings (#102). Already in the build through reqwest.
base64 = "0.22.1"
automerge = "0.6.1"
axum = { version = "0.8.6", features = ["json", "ws"] }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5.53", features = ["derive"] }
futures = "0.3.31"
# HKDF-SHA256 turns a paired devices' X25519 agreement into their pair key (approved by the
# owner, #50). 0.12 matches the `sha2` 0.10 used directly here.
hkdf = "0.12.4"
# Platform keychain for the random embedding key (Issue #40): macOS Keychain, Windows Credential
# Manager, and the pure-Rust (zbus) Secret Service client on Linux/BSD, so no libdbus is needed.
keyring = "4.2.0"
# Already pulled in by `keyring`; used directly for per-platform entry modifiers (the Windows
# target name) and the in-memory mock credential in adapter tests.
keyring-core = "1.0.1"
# Reads imported `.eml` e-mails into project resources (Issue #85, approved by the owner): headers,
# the text body (HTML turned into text) and attachments. Pure Rust, no network access.
mail-parser = "0.11"
libp2p = { version = "0.57.1", features = ["dcutr", "identify", "macros", "mdns", "noise", "relay", "request-response", "tcp", "tokio", "yamux"] }
# Teams bridge wire format (Issue #33): rust-protobuf 3.x runtime for the generated messages.
protobuf = "=3.7.2"
# `font_subsetting` (Issue #37) embeds only the glyphs a PDF uses, which keeps exports with large
# Unicode/CJK fonts small; it pulls in `allsorts`. `owned_ttf_parser` is the same font parser
# printpdf already uses, made direct to check glyph coverage and measure text widths.
printpdf = { version = "0.7.0", features = ["embedded_images", "font_subsetting"] }
owned_ttf_parser = "=0.19.0"
rusqlite = { version = "0.32.1", features = ["bundled"] }
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
libc = "0.2"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
# Teams bridge WebSocket server (Issue #33); also used by the API WebSocket tests.
tokio-tungstenite = "0.28.0"
tower-http = { version = "0.6.6", features = ["cors", "trace"] }
tracing = "0.1.41"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
# Opus compression of the speech kept for the after-meeting pass and sent to the combining device
# (approved by the owner, #88): libopus 1.3.1 translated to Rust, so no C toolchain is needed on
# any target.
unsafe-libopus = "0.2.0"
# `v5` derives stable local meeting UUIDs from Teams meeting IDs (Issue #33).
uuid = { version = "1.18.1", features = ["v4", "v5"] }
# X25519 agreement of a per-pair key between paired devices (approved by the owner, #50); the
# same version libp2p's Noise transport already builds.
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
# Wipes encryption keys and passphrases from memory when dropped.
zeroize = "1.8.1"
# Cross-platform microphone capture for the `microphone` feature (approved by the owner, #45).
cpal = { version = "0.18.2", optional = true }
# 0.16.0 provides native binding compatibility and requires the crate's Rust 1.88 MSRV.
whisper-rs = { version = "=0.16.0", optional = true }
# whisper-rs's own binding, used directly only to list GPUs, which whisper-rs does not expose.
whisper-rs-sys = { version = "=0.15.0", optional = true }
# ONNX Runtime for the `diarization` feature (approved by the owner, #44). rc.13 is the last release
# within the crate's Rust 1.88 MSRV; ndarray and tracing integrations are not needed.
# Provides feature-gated 16 kHz speech classification for the VAD adapter and its contract tests.
webrtc-vad = { version = "=0.4.0", optional = true }

# Android only: Kotlin hands the Keystore-unwrapped database key straight to Rust over JNI, so it
# never passes through the Dart heap (approved by the owner, 2026-10-28).
# Reads who is speaking from call windows over the AT-SPI accessibility bus (#113, approved by
# the owner). Already built for `keyring`'s Secret Service client, with the same default features.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5.19.0"

# Prebuilt ONNX Runtime linked in, except on Windows: ort has no prebuilt for windows-gnu, so the
# Windows build loads Microsoft's onnxruntime.dll from beside the executable at run time (#60).
[target.'cfg(not(any(windows, target_os = "android")))'.dependencies]
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = ["std", "download-binaries", "tls-native", "copy-dylibs", "api-27"] }

[target.'cfg(windows)'.dependencies]
# UI Automation reads who is speaking from call windows (#113, approved by the owner), and the
# audio session manager tells which apps capture the microphone (#111), and the call offer shows
# as a toast (#111); the same release `cpal` already builds.
windows = { version = "0.62.2", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications", "Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Accessibility"] }
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = ["std", "load-dynamic", "api-27"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"
# Android loads Microsoft's ONNX Runtime (MIT, with the QNN provider) from the APK at run time, for
# diarization and the NPU (#75).
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = ["std", "load-dynamic", "api-27"] }

[dev-dependencies]
# Regenerates core/protocol/generated/ from teams_bridge.proto (pure-Rust parser, no protoc) in
# a freshness test. A dev-dependency rather than a build script so the host build graph, and
# with it the native whisper.cpp build, is unchanged.
protobuf-codegen = "=3.7.2"
tower = { version = "0.5.2", features = ["util"] }

# AES-256-GCM is compiled optimized even in dev and test builds. Unoptimized AES and GHASH run
# several times slower than shipped code, so the voice-encryption budget test measured debug
# codegen rather than real cost, and failed on loaded CI runners. Only these crates are affected,
# and the whisper.cpp build is unchanged.
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3
[profile.dev.package.ghash]
opt-level = 3
[profile.dev.package.polyval]
opt-level = 3
[profile.dev.package.ctr]
opt-level = 3

# Our Adreno fixes and an OpenCL build option; see third_party/whisper-rs-sys/README.md (#75).
[patch.crates-io]
whisper-rs-sys = { path = "third_party/whisper-rs-sys" }
