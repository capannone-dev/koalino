# Defines the dependency-light Rust core scaffold; AI engines remain ports only.
[package]
name = "note-taker-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Offline-first meeting note-taking core"

[lib]
path = "core/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
# Keeps the default core build free of native model dependencies and model initialization.
default = []
# Enables the adapter-local whisper.cpp binding for explicitly opted-in local inference.
local-ai = ["dep:whisper-rs"]
vad = ["dep:webrtc-vad"]

[[bin]]
name = "cli"
path = "core/bin/cli.rs"

[[bin]]
name = "daemon"
path = "core/bin/daemon.rs"

[dependencies]
# AES-256-GCM for voice embeddings at rest; `zeroize` wipes key schedules on drop (Issue #31).
aes-gcm = { version = "0.10.3", features = ["zeroize"] }
anyhow = "1.0.100"
# Argon2id passphrase key derivation; only the raw `hash_password_into` API is needed.
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "zeroize"] }
async-trait = "0.1.89"
automerge = "0.6.1"
axum = { version = "0.8.6", features = ["json", "ws"] }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5.53", features = ["derive"] }
futures = "0.3.31"
# Platform keychain for the random embedding key (Issue #40): macOS Keychain, Windows Credential
# Manager, and the pure-Rust (zbus) Secret Service client on Linux/BSD, so no libdbus is needed.
keyring = "4.2.0"
# Already pulled in by `keyring`; used directly for per-platform entry modifiers (the Windows
# target name) and the in-memory mock credential in adapter tests.
keyring-core = "1.0.1"
libp2p = { version = "0.57.1", features = ["macros", "mdns", "noise", "request-response", "tcp", "tokio", "yamux"] }
# Teams bridge wire format (Issue #33): rust-protobuf 3.x runtime for the generated messages.
protobuf = "=3.7.2"
# `font_subsetting` (Issue #37) embeds only the glyphs a PDF uses, which keeps exports with large
# Unicode/CJK fonts small; it pulls in `allsorts`. `owned_ttf_parser` is the same font parser
# printpdf already uses, made direct to check glyph coverage and measure text widths.
printpdf = { version = "0.7.0", features = ["embedded_images", "font_subsetting"] }
owned_ttf_parser = "=0.19.0"
rusqlite = { version = "0.32.1", features = ["bundled"] }
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
# Teams bridge WebSocket server (Issue #33); also used by the API WebSocket tests.
tokio-tungstenite = "0.28.0"
tower-http = { version = "0.6.6", features = ["cors", "trace"] }
tracing = "0.1.41"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
# `v5` derives stable local meeting UUIDs from Teams meeting IDs (Issue #33).
uuid = { version = "1.18.1", features = ["v4", "v5"] }
# Wipes encryption keys and passphrases from memory when dropped.
zeroize = "1.8.1"
# 0.16.0 provides native binding compatibility and requires the crate's Rust 1.88 MSRV.
whisper-rs = { version = "=0.16.0", optional = true }
# Provides feature-gated 16 kHz speech classification for the VAD adapter and its contract tests.
webrtc-vad = { version = "=0.4.0", optional = true }

[dev-dependencies]
# Regenerates core/protocol/generated/ from teams_bridge.proto (pure-Rust parser, no protoc) in
# a freshness test. A dev-dependency rather than a build script so the host build graph, and
# with it the native whisper.cpp build, is unchanged.
protobuf-codegen = "=3.7.2"
tower = { version = "0.5.2", features = ["util"] }

# AES-256-GCM is compiled optimized even in dev and test builds. Unoptimized AES and GHASH run
# several times slower than shipped code, so the voice-encryption budget test measured debug
# codegen rather than real cost, and failed on loaded CI runners. Only these crates are affected,
# and the whisper.cpp build is unchanged.
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3
[profile.dev.package.ghash]
opt-level = 3
[profile.dev.package.polyval]
opt-level = 3
[profile.dev.package.ctr]
opt-level = 3
