// Wire protocol between the local Rust app and the processes that bring it online meetings: the C#
// Teams bot (Issue #33) and the browser extension's native messaging host (Issue #102).
//
// Transport: one WebSocket connection to ws://127.0.0.1:<port> (default 8765). When a shared
// secret is configured, the first frame is the text frame {"auth":"<secret>"}; every other frame
// is a binary frame holding exactly one serialized TeamsBridgeMessage. See README.md.
syntax = "proto3";

package note_taker.teams_bridge.v1;

// A Teams participant; `external_id` is the stable Teams user ID used for identity mapping.
message ExternalParticipant {
  string external_id = 1;  // Teams User ID
  string display_name = 2;
  string email = 3;  // Optional; empty when unknown. Never logged.
}

// What an audio track carries (Issue #102). The bot only sends PARTICIPANT tracks.
enum TrackKind {
  // One participant's isolated audio (the bot), or the owner's own microphone (the browser).
  PARTICIPANT = 0;
  // Every remote participant mixed into one track, as a browser receives a call. Its voices are
  // told apart and matched against the voice gallery; it is never credited to `participant`.
  MIXED_REMOTE = 1;
}

// One track's audio. Senders SHOULD send 1-30 s per chunk; chunks longer than 30 s are rejected.
message AudioChunk {
  ExternalParticipant participant = 1;
  bytes audio_data = 2;  // PCM 16kHz mono, signed 16-bit little-endian
  uint64 timestamp_ms = 3;  // Chunk start, relative to MeetingMetadata.start_time_ms
  uint32 sample_rate = 4;  // Must be 16000
  TrackKind track = 5;  // PARTICIPANT when absent
}

// A text document produced by the meeting service, stored as an attachment of the meeting
// (Issue #102): the Teams transcript downloaded after the meeting, the live transcript panel, or
// the live captions.
message MeetingDocument {
  string kind = 1;  // "teams_transcript", "teams_live_transcript" or "teams_captions"
  string media_type = 2;  // "text/vtt" or "text/plain"
  bytes content = 3;  // UTF-8 text, at most 4 MiB
  uint64 timestamp_ms = 4;  // Where it belongs in the meeting (normally 0)
  // The Teams meeting ID it belongs to; empty means the active meeting. Set it for a transcript
  // published after the meeting ended, so the finished meeting is not reopened.
  string meeting_id = 5;
}

// The meeting is over: the receiver closes it, so the after-meeting pass can run.
message MeetingEnded {
  string meeting_id = 1;  // Must match the active MeetingMetadata.meeting_id
}

// A video frame; only "screen_share" frames become slide captures.
message VideoFrame {
  bytes image_data = 1;  // JPEG or PNG
  uint64 timestamp_ms = 2;  // Relative to MeetingMetadata.start_time_ms
  string source = 3;  // "screen_share" or "camera"
}

// Starts (or, after a reconnect, resumes) a meeting; must precede its audio and video.
message MeetingMetadata {
  string meeting_id = 1;  // Teams meeting ID; mapped to a stable local meeting UUID
  string meeting_title = 2;
  uint64 start_time_ms = 3;  // Unix epoch milliseconds
  repeated ExternalParticipant participants = 4;
}

// The envelope carried by every binary WebSocket frame.
message TeamsBridgeMessage {
  oneof payload {
    AudioChunk audio = 1;
    VideoFrame video = 2;
    MeetingMetadata metadata = 3;
    MeetingDocument document = 4;
    MeetingEnded ended = 5;
  }
}
