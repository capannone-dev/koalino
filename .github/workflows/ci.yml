# Runs the Rust core's required formatting, linting, and unit-test gates on every change.
name: Core CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Run Rust lints
        run: make rust-lint
      - name: Run Rust unit tests
        run: make rust-test
