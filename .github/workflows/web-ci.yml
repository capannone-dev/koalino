# Verifies the Node-based dashboard (lint, component tests, build) in GitHub Actions on every relevant change.

name: Web CI

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web-ci.yml"]
  pull_request:
    paths: ["web/**", ".github/workflows/web-ci.yml"]

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # package-lock.json is gitignored, so the cache is keyed on package.json (exact versions).
          cache-dependency-path: web/package.json
      - name: Install web dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      # The verbose reporter lists every test by name, so the run log shows which UI behaviors
      # (for example the meeting rename dialog) were checked.
      - name: Component and API client tests
        run: npm run test -- --reporter=verbose
      - name: Production build
        run: npm run build
