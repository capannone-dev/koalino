# Draft of Koalino's F-Droid recipe (#163), to be submitted as metadata/io.github.capannone_dev.koalino.yml
# in a merge request to https://gitlab.com/fdroid/fdroiddata once the repository is public. See
# README.md beside it for what the build leaves out and why. Rust comes from Debian's rustup, pinned
# to the toolchain the Android builds use; Flutter from fdroiddata's flutter srclib.
AntiFeatures:
  NonFreeNet:
    en-US: Optional summaries and chat can use a cloud AI service the user connects
      (for example OpenAI, Google or Mistral). Off by default; transcription always
      runs on the device.
Categories:
  - Multimedia
  - Writing
License: GPL-3.0-or-later
AuthorName: The Koalino contributors
SourceCode: https://github.com/capannone-dev/koalino
IssueTracker: https://github.com/capannone-dev/koalino/issues
Changelog: https://github.com/capannone-dev/koalino/releases

AutoName: Koalino

RepoType: git
Repo: https://github.com/capannone-dev/koalino.git

Builds:
  - versionName: 0.2.0
    versionCode: 2
    commit: v0.2.0-preview.2
    subdir: ui
    sudo:
      - apt-get update
      - apt-get install -y rustup cmake make clang libclang-dev curl
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.47.8
    rm:
      - web
      - browser-extension
    prebuild:
      - ../tools/fdroid/prepare.sh
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scanignore:
      - core/protocol/fixtures
    scandelete:
      - ui/.pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - rustup default 1.99.1
      - rustup target add aarch64-linux-android
      - ANDROID_NDK=$$NDK$$ ../tools/fdroid/build-core.sh arm64
      - $$flutter$$/bin/flutter build apk --release --target-platform android-arm64
        --dart-define=KOALINO_NO_BUNDLED_MODELS=true
    ndk: r27c

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+(-preview\.[0-9]+)?$
UpdateCheckData: ui/pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 0.2.0
CurrentVersionCode: 2
