<!doctype html>
<!-- The extension's popup (Issue #102, #174, #212): meeting-site access only when it is missing, the connection status
     (checked on opening), current recordings, one main button (Record this tab / Stop), and a link to the settings,
     which live on the options page. Elements with data-i18n get their text in the browser's language (#124). It also
     opens in a tab after install when Teams access is missing. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Koalino</title>
    <link rel="stylesheet" href="koalino.css" />
    <style>
      body { padding: 12px; width: 300px; }
      #recordings, #transcripts { white-space: pre-line; }
      #record-tab-problem { margin-top: 4px; }
      footer { margin-top: 10px; display: flex; justify-content: flex-end; }
    </style>
  </head>
  <body>
    <h1><img src="icon-32.png" alt="" width="24" height="24" />Koalino</h1>
    <div id="access" class="banner" hidden>
      <div id="access-text" data-i18n="accessMissing">Koalino may not run on the meeting sites yet.</div>
      <button id="allow" type="button" data-i18n="allowOnTeams">Allow on meeting sites</button>
    </div>
    <div class="card" aria-live="polite">
      <div id="host" class="checking" data-i18n="checking">Checking the connection…</div>
      <div id="recordings" class="hint"></div>
      <div id="transcripts" class="hint" hidden></div>
      <button id="check" type="button" data-icon="refresh" data-i18n="checkAgain" hidden>Check again</button>
    </div>
    <button id="record-tab" class="primary" type="button" data-i18n="recordThisTab">Record this tab</button>
    <div class="hint" data-i18n="recordThisTabHint">Records the sound and shared screen of a call on any site.</div>
    <div id="record-tab-problem" class="bad" data-i18n="cannotRecordTab" hidden>This tab can't be recorded.</div>
    <footer><a id="open-settings" href="options.html" data-icon="settings" data-i18n="settings">Settings</a></footer>
    <script src="popup.js"></script>
  </body>
</html>
