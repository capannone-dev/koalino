<!doctype html>
<!-- The extension's popup: Teams access, connection status, current recordings and settings (Issue #102). Elements with data-i18n get their text in the browser's language from popup.ts (#124). It also opens in a tab after install when Teams access is missing. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Koalino</title>
    <style>
      body { font: 13px/1.4 system-ui, sans-serif; margin: 0; padding: 12px; width: 300px; color: #111827; }
      h1 { font-size: 15px; margin: 0 0 8px; }
      .status { padding: 8px; border-radius: 6px; background: #f3f4f6; margin-bottom: 10px; }
      .ok { color: #047857; } .warn { color: #b45309; } .bad { color: #b91c1c; }
      label { display: flex; gap: 8px; align-items: flex-start; margin: 6px 0; }
      .hint { color: #6b7280; font-size: 12px; }
      button { font: inherit; margin-top: 6px; }
      #recordings { white-space: pre-line; }
    </style>
  </head>
  <body>
    <h1>Koalino</h1>
    <div id="access" class="status bad" hidden>
      <div id="access-text" data-i18n="accessMissing">Koalino may not run on Teams (or on the SharePoint page Teams shows transcripts from) yet, so it cannot record your meetings or fetch their transcripts.</div>
      <button id="allow" type="button" data-i18n="allowOnTeams">Allow on Teams</button>
    </div>
    <div class="status">
      <div id="host"></div>
      <div id="recordings"></div>
      <div id="transcripts" hidden></div>
      <button id="check" type="button" data-i18n="checkConnection">Check connection</button>
    </div>
    <label><input type="checkbox" data-setting="alwaysRecordTeams" /> <span><span data-i18n="alwaysRecord">Always record Teams meetings</span><br /><span class="hint" data-i18n="alwaysRecordHint">Otherwise you are asked when a call starts.</span></span></label>
    <label><input type="checkbox" data-setting="captureCaptions" /> <span><span data-i18n="useCaptions">Use Teams live captions</span><br /><span class="hint" data-i18n="useCaptionsHint">Names who spoke when; turned on in the call for you only.</span></span></label>
    <label><input type="checkbox" data-setting="captureSlides" /> <span data-i18n="keepSlides">Keep shared slides</span></label>
    <label><input type="checkbox" data-setting="fetchTeamsTranscripts" /> <span><span data-i18n="fetchTranscript">Fetch the Teams transcript after the meeting</span><br /><span class="hint" data-i18n="fetchTranscriptHint">Whoever started it, when your account can see it.</span></span></label>
    <label><input type="checkbox" data-setting="startTeamsTranscription" /> <span><span data-i18n="startTranscription">Start Teams transcription when I record</span><br /><span class="hint" data-i18n="startTranscriptionHint">Everyone sees it, and Microsoft stores the transcript.</span></span></label>
    <script src="popup.js"></script>
  </body>
</html>
